version: 2.1
jobs:
  pangolin:
    docker: [{ image: cimg/python:3.12 }]
    steps:
      - checkout
      # published only by SmartTasksOrg/sf-smartpangolin, with provenance; pin the version you reviewed
      - run: python -m pip install "sf-smartpangolin==3.0.0"
      - run: sf-smartpangolin pack --dry-run --share public --root .
workflows:
  guard: { jobs: [pangolin] }
