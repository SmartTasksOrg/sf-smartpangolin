# CI: tests and the install-line check on every push to the default branch and
# every pull request. Actions are pinned to commits (comment: tag, date read).
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: python -m pytest -q
      - name: Self-seal (dogfood)
        run: sf-smartpangolin pack --root . --share public --dry-run --debug

  install-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: '3.12'
      - name: No document names a package the maintainers do not hold
        run: python scripts/check_install_lines.py
